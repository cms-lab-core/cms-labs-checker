name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Go format and lint
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-go@v7.0.0
        with:
          go-version: "1.26.0"
          cache: true
      - name: Verify module and formatting
        run: |
          go mod tidy
          gofmt -w .
          git diff --exit-code
      - uses: golangci/golangci-lint-action@v9.3.0
        with:
          version: v2.13.2
          args: ./... --timeout=10m

  test:
    name: Unit tests with race detector
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-go@v7.0.0
        with:
          go-version: "1.26.0"
          cache: true
      - run: go test -race -coverprofile=coverage.out ./...
      - uses: actions/upload-artifact@v7.0.1
        with:
          name: go-coverage
          path: coverage.out
          if-no-files-found: error
          retention-days: 14

  contract:
    name: CLI contract smoke
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-go@v7.0.0
        with:
          go-version: "1.26.0"
          cache: true
      - name: Build checker
        run: go build -trimpath -o "$RUNNER_TEMP/checker" ./cmd/checker
      - name: Exercise selector and result contract
        env:
          ATTEMPT_ID: ci-attempt
          SESSION_ID: ci-session
          SESSION_NAMESPACE: lab-ci
          TEST_PATH: checks/smoke.go
        run: |
          "$RUNNER_TEMP/checker" -output "$RUNNER_TEMP/result.json"
          jq -e '
            .max_score == 2 and
            .current_score == 2 and
            .tasks[0].logs[0].namespace == "lab-ci" and
            .tasks[0].complete == true
          ' "$RUNNER_TEMP/result.json"
          test "$(wc -c < "$RUNNER_TEMP/result.json")" -le 4096
